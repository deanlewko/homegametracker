<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin - Poker Pot Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070c;
      --surface: #0d1422;
      --surface-2: #151f31;
      --ink: #f8fafc;
      --muted: #aab6c8;
      --line: #263248;
      --accent: #2f80ed;
      --accent-2: #1f65c7;
      --danger: #f87171;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      padding: 20px;
    }

    main {
      width: min(100%, 860px);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    form,
    .admin-tools {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
    }

    input,
    button {
      font: inherit;
      min-height: 46px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #080d16;
      color: var(--ink);
      padding: 10px 12px;
    }

    .top-actions,
    .grid {
      display: grid;
      gap: 10px;
    }

    .top-actions {
      grid-template-columns: 1fr 1fr;
    }

    .stats-list {
      display: grid;
      gap: 10px;
    }

    .stat-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .stat-title,
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    .row {
      border-top: 1px solid var(--line);
      padding-top: 7px;
      color: var(--muted);
      font-size: .94rem;
    }

    .positive {
      color: #4ade80;
    }

    .negative {
      color: #f87171;
    }

    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      padding: 10px 12px;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: .92rem;
    }

    .error {
      color: var(--danger);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" id="loginPanel">
      <h1>Admin login</h1>
      <p>Enter the admin password set in Netlify. The password is checked server-side, not stored in this page.</p>
      <form id="loginForm">
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Unlock admin</button>
        <div class="status" id="loginStatus" role="status"></div>
      </form>
    </section>

    <section class="panel" id="adminPanel" hidden>
      <h1>Admin</h1>
      <div class="admin-tools">
        <p>View private game stats and manage barred players.</p>
        <div class="top-actions">
          <button class="secondary" id="refreshBtn" type="button">Refresh stats</button>
          <button class="secondary" id="logoutBtn" type="button">Log out</button>
        </div>
        <div class="status" id="adminStatus" role="status"></div>
      </div>
    </section>

    <section class="panel admin-only" hidden>
      <h2>Bar a player</h2>
      <form id="barForm">
        <label>
          Player name
          <input id="barName" autocomplete="off" required>
        </label>
        <label>
          Admin note
          <input id="barNote" autocomplete="off" placeholder="Optional reason or reminder">
        </label>
        <button type="submit">Bar player</button>
      </form>
    </section>

    <section class="panel admin-only" hidden>
      <h2>Barred players</h2>
      <div class="stats-list" id="barredList"></div>
    </section>

    <section class="panel admin-only" hidden>
      <h2>Lifetime player win/loss</h2>
      <div class="stats-list" id="lifetimeList"></div>
    </section>

    <section class="panel admin-only" hidden>
      <h2>Session win/loss</h2>
      <div class="stats-list" id="sessionList"></div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = "home-poker-admin-token";

    const els = {
      loginPanel: document.querySelector("#loginPanel"),
      adminPanel: document.querySelector("#adminPanel"),
      loginForm: document.querySelector("#loginForm"),
      password: document.querySelector("#password"),
      loginStatus: document.querySelector("#loginStatus"),
      adminStatus: document.querySelector("#adminStatus"),
      refreshBtn: document.querySelector("#refreshBtn"),
      logoutBtn: document.querySelector("#logoutBtn"),
      adminOnly: document.querySelectorAll(".admin-only"),
      barForm: document.querySelector("#barForm"),
      barName: document.querySelector("#barName"),
      barNote: document.querySelector("#barNote"),
      barredList: document.querySelector("#barredList"),
      lifetimeList: document.querySelector("#lifetimeList"),
      sessionList: document.querySelector("#sessionList")
    };

    const dollars = new Intl.NumberFormat("en-AU", { style: "currency", currency: "AUD" });

    function setLoggedIn(isLoggedIn) {
      els.loginPanel.hidden = isLoggedIn;
      els.adminPanel.hidden = !isLoggedIn;
      els.adminOnly.forEach((panel) => {
        panel.hidden = !isLoggedIn;
      });
      if (!isLoggedIn) window.setTimeout(() => els.password.focus(), 50);
    }

    async function callAdminFunction(path, options = {}) {
      const token = sessionStorage.getItem(TOKEN_KEY);
      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };
      if (token) headers.Authorization = `Bearer ${token}`;

      const response = await fetch(path, { ...options, headers });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(body.error || "Something went wrong");
        error.status = response.status;
        throw error;
      }
      return body;
    }

    async function login(event) {
      event.preventDefault();
      els.loginStatus.textContent = "Checking...";
      els.loginStatus.className = "status";

      try {
        const body = await callAdminFunction("/.netlify/functions/admin-login", {
          method: "POST",
          body: JSON.stringify({ password: els.password.value })
        });
        sessionStorage.setItem(TOKEN_KEY, body.token);
        els.password.value = "";
        els.loginStatus.textContent = "";
        els.adminStatus.textContent = "Logged in.";
        setLoggedIn(true);
        loadAdminData();
      } catch (error) {
        els.loginStatus.textContent = error.message;
        els.loginStatus.className = "status error";
      }
    }

    function formatAmount(value) {
      return dollars.format(Math.round((Number(value) || 0) * 100) / 100);
    }

    function netClass(value) {
      return value > 0 ? "positive" : value < 0 ? "negative" : "";
    }

    async function loadAdminData() {
      els.adminStatus.textContent = "Loading stats...";
      els.adminStatus.className = "status";
      try {
        const data = await callAdminFunction("/.netlify/functions/admin-data");
        renderAdminData(data);
        els.adminStatus.textContent = "Stats loaded.";
      } catch (error) {
        els.adminStatus.textContent = error.message;
        els.adminStatus.className = "status error";
        if (error.status === 401) {
          sessionStorage.removeItem(TOKEN_KEY);
          setLoggedIn(false);
        }
      }
    }

    function renderAdminData(data) {
      renderBarredPlayers(data.barredPlayers || []);
      renderLifetime(data.lifetime || []);
      renderSessions(data.sessions || []);
    }

    function renderBarredPlayers(players) {
      if (!players.length) {
        els.barredList.innerHTML = '<p>No barred players.</p>';
        return;
      }

      els.barredList.innerHTML = "";
      players.forEach((player) => {
        const card = document.createElement("div");
        card.className = "stat-card";
        card.innerHTML = `
          <div class="stat-title">
            <strong></strong>
            <button class="secondary" type="button">Unbar</button>
          </div>
          <p></p>
        `;
        card.querySelector("strong").textContent = player.name;
        card.querySelector("p").textContent = player.note || "No note.";
        card.querySelector("button").addEventListener("click", () => setBarred(player.name, "", false));
        els.barredList.append(card);
      });
    }

    function renderLifetime(players) {
      if (!players.length) {
        els.lifetimeList.innerHTML = '<p>No saved sessions yet.</p>';
        return;
      }

      els.lifetimeList.innerHTML = "";
      players.forEach((player) => {
        const card = document.createElement("div");
        card.className = "stat-card";
        card.innerHTML = `
          <div class="stat-title">
            <strong></strong>
            <strong class="${netClass(player.net)}">${formatAmount(player.net)}</strong>
          </div>
          <p></p>
        `;
        card.querySelector("strong").textContent = player.name;
        card.querySelector("p").textContent = `${player.sessions} session${player.sessions === 1 ? "" : "s"} · In ${formatAmount(player.totalBuyIn)} · Out ${formatAmount(player.totalCashOut)}`;
        els.lifetimeList.append(card);
      });
    }

    function renderSessions(sessions) {
      if (!sessions.length) {
        els.sessionList.innerHTML = '<p>No saved sessions yet. Sessions are saved when you start a new game.</p>';
        return;
      }

      els.sessionList.innerHTML = "";
      sessions.forEach((session) => {
        const card = document.createElement("div");
        card.className = "stat-card";
        const date = session.finishedAt ? new Date(session.finishedAt).toLocaleString() : "";
        card.innerHTML = `
          <div class="stat-title">
            <strong></strong>
            <span></span>
          </div>
          <p></p>
          <div class="grid"></div>
        `;
        card.querySelector("strong").textContent = session.sessionName || "Home game";
        card.querySelector("span").textContent = date;
        const sessionPath = session.sessionSlug ? ` · /${session.sessionSlug}` : "";
        card.querySelector("p").textContent = `In ${formatAmount(session.totalBuyIn)} · Out ${formatAmount(session.totalCashOut)}${sessionPath}`;
        const rows = card.querySelector(".grid");
        session.players
          .slice()
          .sort((a, b) => b.net - a.net)
          .forEach((player) => {
            const row = document.createElement("div");
            row.className = "row";
            row.innerHTML = `<span></span><strong class="${netClass(player.net)}">${formatAmount(player.net)}</strong>`;
            row.querySelector("span").textContent = player.name;
            rows.append(row);
          });
        els.sessionList.append(card);
      });
    }

    async function setBarred(name, note = "", barred = true) {
      els.adminStatus.textContent = barred ? "Barring player..." : "Removing bar...";
      els.adminStatus.className = "status";
      try {
        await callAdminFunction("/.netlify/functions/admin-bar-player", {
          method: "POST",
          body: JSON.stringify({ name, note, barred })
        });
        els.barName.value = "";
        els.barNote.value = "";
        loadAdminData();
      } catch (error) {
        els.adminStatus.textContent = error.message;
        els.adminStatus.className = "status error";
      }
    }

    function submitBar(event) {
      event.preventDefault();
      setBarred(els.barName.value, els.barNote.value, true);
    }

    function logout() {
      sessionStorage.removeItem(TOKEN_KEY);
      els.adminStatus.textContent = "";
      setLoggedIn(false);
    }

    els.loginForm.addEventListener("submit", login);
    els.refreshBtn.addEventListener("click", loadAdminData);
    els.logoutBtn.addEventListener("click", logout);
    els.barForm.addEventListener("submit", submitBar);

    if (sessionStorage.getItem(TOKEN_KEY)) {
      setLoggedIn(true);
      loadAdminData();
    } else {
      setLoggedIn(false);
    }
  </script>
</body>
</html>
