<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin - Poker Pot Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070c;
      --surface: #0d1422;
      --surface-2: #151f31;
      --ink: #f8fafc;
      --muted: #aab6c8;
      --line: #263248;
      --accent: #2f80ed;
      --accent-2: #1f65c7;
      --danger: #f87171;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      padding: 20px;
    }

    main {
      width: min(100%, 460px);
      display: grid;
      gap: 16px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    form,
    .admin-tools {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
    }

    input,
    button {
      font: inherit;
      min-height: 46px;
      border-radius: 8px;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #080d16;
      color: var(--ink);
      padding: 10px 12px;
    }

    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      padding: 10px 12px;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: .92rem;
    }

    .error {
      color: var(--danger);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" id="loginPanel">
      <h1>Admin login</h1>
      <p>Enter the admin password set in Netlify. The password is checked server-side, not stored in this page.</p>
      <form id="loginForm">
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Unlock admin</button>
        <div class="status" id="loginStatus" role="status"></div>
      </form>
    </section>

    <section class="panel" id="adminPanel" hidden>
      <h1>Admin</h1>
      <div class="admin-tools">
        <p>You are logged in. This is the private area where stat requests and approvals can go next.</p>
        <button class="secondary" id="checkBtn" type="button">Check session</button>
        <button class="secondary" id="logoutBtn" type="button">Log out</button>
        <div class="status" id="adminStatus" role="status"></div>
      </div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = "home-poker-admin-token";

    const els = {
      loginPanel: document.querySelector("#loginPanel"),
      adminPanel: document.querySelector("#adminPanel"),
      loginForm: document.querySelector("#loginForm"),
      password: document.querySelector("#password"),
      loginStatus: document.querySelector("#loginStatus"),
      adminStatus: document.querySelector("#adminStatus"),
      checkBtn: document.querySelector("#checkBtn"),
      logoutBtn: document.querySelector("#logoutBtn")
    };

    function setLoggedIn(isLoggedIn) {
      els.loginPanel.hidden = isLoggedIn;
      els.adminPanel.hidden = !isLoggedIn;
      if (!isLoggedIn) window.setTimeout(() => els.password.focus(), 50);
    }

    async function callAdminFunction(path, options = {}) {
      const token = sessionStorage.getItem(TOKEN_KEY);
      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };
      if (token) headers.Authorization = `Bearer ${token}`;

      const response = await fetch(path, { ...options, headers });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || "Something went wrong");
      return body;
    }

    async function login(event) {
      event.preventDefault();
      els.loginStatus.textContent = "Checking...";
      els.loginStatus.className = "status";

      try {
        const body = await callAdminFunction("/.netlify/functions/admin-login", {
          method: "POST",
          body: JSON.stringify({ password: els.password.value })
        });
        sessionStorage.setItem(TOKEN_KEY, body.token);
        els.password.value = "";
        els.loginStatus.textContent = "";
        els.adminStatus.textContent = "Logged in.";
        setLoggedIn(true);
      } catch (error) {
        els.loginStatus.textContent = error.message;
        els.loginStatus.className = "status error";
      }
    }

    async function checkSession() {
      els.adminStatus.textContent = "Checking session...";
      els.adminStatus.className = "status";
      try {
        await callAdminFunction("/.netlify/functions/admin-check");
        els.adminStatus.textContent = "Admin session is valid.";
      } catch (error) {
        sessionStorage.removeItem(TOKEN_KEY);
        els.adminStatus.textContent = error.message;
        els.adminStatus.className = "status error";
        setLoggedIn(false);
      }
    }

    function logout() {
      sessionStorage.removeItem(TOKEN_KEY);
      els.adminStatus.textContent = "";
      setLoggedIn(false);
    }

    els.loginForm.addEventListener("submit", login);
    els.checkBtn.addEventListener("click", checkSession);
    els.logoutBtn.addEventListener("click", logout);

    if (sessionStorage.getItem(TOKEN_KEY)) {
      setLoggedIn(true);
      checkSession();
    } else {
      setLoggedIn(false);
    }
  </script>
</body>
</html>
